[project]
name = "ashare-simulator"
version = "0.2.2"
description = "大A交易策略真实模拟器 - 后端"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "duckdb>=1.0",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "akshare>=1.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
